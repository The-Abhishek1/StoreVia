ksp = "2.0.21-1.0.28"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navCompose = "2.8.5"
room = "2.6.1"
hilt = "2.52"
hiltNavCompose = "1.2.0"
coroutines = "1.9.0"
datastore = "1.1.1"
workManager = "2.10.0"
desugar = "2.1.3"
supabase = "3.0.3"
ktor = "3.0.3"
serialization = "1.7.3"
junit = "4.13.2"
turbine = "1.2.0"
